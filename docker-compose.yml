version: "3.8"

services:
  online_shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online_shop
    expose:
      - "3000"
    networks:
      - proxy-tier

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./dist:/usr/share/nginx/html:ro   # assuming you build static files here
    networks:
      - proxy-tier

networks:
  proxy-tier:
    driver: bridge
